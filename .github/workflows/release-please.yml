name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

      # `latest` is the install branch: the Package Manager's Update button follows it, so it only ever
      # moves to a release. A release is created on the push that merged the release PR, so it tags github.sha.
      - name: Move latest to the release
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/${{ github.repository }}/git/refs/heads/latest" -f sha="${{ github.sha }}" -F force=true
